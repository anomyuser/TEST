<!DOCTYPE html>
<html lang="ko">
<head>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stone: { 850: '#1c1917', 900: '#0c0a09' }
                    }
                }

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            height: 100dvh;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Light Mode */
        body:not(.dark) {
            background: linear-gradient(180deg, #fd511d 0%, #f5ca30 50%, #f6ef70 100%);
            color: #44403c;
        }

        /* Dark Mode */
        body.dark {
            background-color: #0f172a;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: #e7e5e4;
        }

        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: background 0.3s, border-color 0.3s;
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e7e5e4;
        }

        /* Sticky Headers */
        .sticky-col-header { position: sticky; top: 0; z-index: 20; background-color: rgba(250, 250, 249, 0.95); }
        .dark .sticky-col-header { background-color: rgba(30, 41, 59, 0.95); color: #e7e5e4; }
        .sticky-row-header { position: sticky; left: 0; z-index: 10; background-color: rgba(250, 250, 249, 0.95); border-right: 1px solid #e7e5e4; }
        .dark .sticky-row-header { background-color: rgba(30, 41, 59, 0.95); border-right: 1px solid #475569; }
        .sticky-corner { position: sticky; top: 0; left: 0; z-index: 30; background-color: rgba(250, 250, 249, 1); }
        .dark .sticky-corner { background-color: rgba(30, 41, 59, 1); }

        .log-item { border-left-width: 4px; }
        .dark .log-item { background-color: #1e293b; color: #e7e5e4; }
        
        .fab-btn {
            position: fixed; right: 1.5rem; bottom: 6rem; z-index: 50;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fab-btn:active { transform: scale(0.95); }
    </style>
</head>

    <script>
        // --- UI Helpers (Toast & Confirm) ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgColor = 'bg-stone-800 dark:bg-slate-700';
            let icon = 'fa-info-circle text-blue-400';
            
            if (type === 'success') {
                icon = 'fa-check-circle text-green-400';
            } else if (type === 'error') {
                icon = 'fa-exclamation-circle text-red-400';
            }

            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm transform transition-all duration-300 -translate-y-4 opacity-0 pointer-events-auto w-full`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-4', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let confirmCallback = null;
        function showConfirm(message, callback) {
            document.getElementById('confirm-message').innerHTML = message;
            confirmCallback = callback;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        document.getElementById('btn-confirm-cancel').addEventListener('click', () => {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmCallback = null;
        });

        document.getElementById('btn-confirm-ok').addEventListener('click', () => {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (confirmCallback) confirmCallback();
            confirmCallback = null;
        });


        // --- Data Definitions ---
        const ZONES = [
            { id: 'tent', name: '텐트 구역', icon: 'fa-tent', color: 'bg-orange-50/80 dark:bg-orange-900/20 border-orange-200 dark:border-orange-800' },
            { id: 'fire', name: '모닥불', icon: 'fa-fire', color: 'bg-red-50/80 dark:bg-red-900/20 border-red-200 dark:border-red-800' },
            { id: 'cook', name: '야외 키친', icon: 'fa-kitchen-set', color: 'bg-yellow-50/80 dark:bg-yellow-900/20 border-yellow-200 dark:border-yellow-800' },
            { id: 'stream', name: '계곡', icon: 'fa-water', color: 'bg-blue-50/80 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800' },
            { id: 'forest', name: '숲 산책로', icon: 'fa-tree', color: 'bg-emerald-50/80 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800' },
            { id: 'hammock', name: '해먹 존', icon: 'fa-umbrella-beach', color: 'bg-purple-50/80 dark:bg-purple-900/20 border-purple-200 dark:border-purple-800' }
        ];

        const VOCAB = {
            food: [
                '바베큐', '라면', '김치찌개', '볶음밥', '어묵탕', '된장찌개', '스테이크', 
                '삼겹살', '부대찌개', '토마호크', '비어치킨', '닭꼬치', '군고구마', '마시멜로', 
                '카레', '핫도그', '옥수수', '감자구이', '채소구이', '생선구이', '꼬치구이', 
                '감바스', '샌드위치', '샐러드', '밀푀유나베', '파전', '우동', '떡볶이'
            ],

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                toggleDarkMode(true);
            }
            document.getElementById('new-name').addEventListener('keyup', function(e) {

            renderTraitTable();
            renderZones();

        // --- Core Functions ---
        function toggleDarkMode(forceDark = null) {
            const body = document.body;
            if (forceDark === true) {
                body.classList.add('dark');
                state.isDark = true;
            } else if (forceDark === false) {
                body.classList.remove('dark');
                state.isDark = false;
            } else {
                body.classList.toggle('dark');
                state.isDark = !state.isDark;
            }
        }

        function toggleInfoModal() {
            const modal = document.getElementById('info-modal');
            modal.classList.toggle('hidden');
        }

        function addCharacter() {
            const nameInput = document.getElementById('new-name');
            const name = nameInput.value.trim();
            if (!name) return showToast('이름을 입력해주세요.', 'error');
            if (state.characters.some(c => c.name === name)) return showToast('이미 존재하는 이름입니다.', 'error');
            if (state.characters.length >= 20) return showToast('최대 20명까지만 등록 가능합니다.', 'error');

            const newChar = {
                id: 'char_' + Date.now(),
                name: name,
                traits: {},
                relationships: {},
                location: null,
                status: '대기 중'
            };
            Object.keys(TRAIT_DATA).forEach(k => newChar.traits[k] = null);
            state.characters.push(newChar);
            nameInput.value = '';
            renderTraitTable();
            updateUI();
        }

        function saveAndStart() {
            if (state.characters.length < 1) return showToast('최소 1명의 캐릭터가 필요합니다.', 'error');
            state.isStarted = true;
            document.getElementById('btn-next-day').disabled = false;
            updateUI();
            showToast('설정이 저장되었습니다. 우측 하단의 재생 버튼을 눌러 시작하세요!', 'success');
            switchTab('camp');
        }

        // --- Data Management Functions ---
        function saveLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                showToast('브라우저에 저장되었습니다.', 'success');
            } catch(e) {
                showToast('저장 실패: ' + e, 'error');
            }
        }

        function loadLocal() {
            const data = localStorage.getItem(STORAGE_KEY);
            if(!data) return showToast('저장된 데이터가 없습니다.', 'error');
            try {
                const parsed = JSON.parse(data);
                state = { ...state, ...parsed };
                restoreUI();
                showToast('데이터를 불러왔습니다.', 'success');
            } catch(e) {
                showToast('데이터 불러오기 실패: ' + e, 'error');
            }
        }

            downloadAnchorNode.setAttribute("download", "camping_save.json");

                    id: c.id,

                    traits: c.traits,
                    relationships: {},
                    location: null,
                    status: '대기 중'
                }))

            rosterData.characters.forEach(c1 => {

                rosterData.characters.forEach(c2 => {

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rosterData));
            const downloadAnchorNode = document.createElement('a');

            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importJSON(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    state = { ...state, ...parsed };
                    restoreUI();
                    showToast('파일을 불러왔습니다.', 'success');
                } catch(err) {
                    showToast('올바르지 않은 파일입니다.', 'error');
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        // --- Logic: Simulation ---

        function nextDay() {
            if (!state.isStarted) return showToast('먼저 명단 탭에서 설정을 완료해주세요.', 'error');

            const currentDay = state.day;
            const dayLogs = [];
            
            const shuffled = [...state.characters].sort(() => Math.random() - 0.5);
            const groups = [];
            while(shuffled.length > 0) {
                if (shuffled.length >= 2 && Math.random() > 0.3) {
                    groups.push([shuffled.pop(), shuffled.pop()]);
                } else {
                    groups.push([shuffled.pop()]);
                }
            }

            groups.forEach(group => {
                const isDuo = group.length === 2;
                let c1 = group[0];
                let c2 = isDuo ? group[1] : null;

                if (Math.random() < 0.3) {
                    let template;
                    if (isDuo) {
                        template = getRandom(GENERAL_SCRIPTS_DUO);
                    } else {
                        template = getRandom(GENERAL_SCRIPTS_SOLO);
                    }
                    const script = formatScript(template, getContext(c1, c2));
                    
                    dayLogs.push({ type: 'general', text: script });
                    c1.status = "휴식 중";
                    c1.location = ZONES[Math.floor(Math.random() * ZONES.length)].id;
                    if(isDuo) {
                        c2.status = "휴식 중";
                        c2.location = c1.location;
                    }
                    return;
                }

                const traitKey = getRandom(Object.keys(TRAIT_DATA));
                const traitInfo = TRAIT_DATA[traitKey];
                
                const location = traitInfo.room;
                c1.location = location;
                if (isDuo) c2.location = location;

                let t1 = getEffectiveTrait(c1, traitKey);
                
                if (!isDuo) {
                    const isSuccess = Math.random() < 0.6;
                    const resultKey = isSuccess ? 'success' : 'fail';
                    const boolKey = t1 ? 'yes' : 'no';
                    
                    const templates = traitInfo[resultKey][boolKey];
                    const script = formatScript(getRandom(templates), getContext(c1));
                    
                    dayLogs.push({ type: isSuccess ? 'success' : 'fail', text: script });
                    c1.status = isSuccess ? `${traitInfo.text} (성공)` : `${traitInfo.text} (실패)`;

                } else {
                    let t2 = getEffectiveTrait(c2, traitKey);
                    const isSame = (t1 === t2);
                    let resultKey = 'same_no';

                    if (isSame) {
                        resultKey = t1 ? 'same_yes' : 'same_no';
                    } else {
                        resultKey = 'diff';
                        if (!t1 && t2) {
                            [c1, c2] = [c2, c1];
                            [t1, t2] = [t2, t1];
                        }
                    }
                    
                    let successRate = isSame ? 0.7 : 0.4;
                    const isSuccess = Math.random() < successRate; 
                    
                    const templates = traitInfo.duo[resultKey][isSuccess ? 'success' : 'fail'];
                    const script = formatScript(getRandom(templates), getContext(c1, c2));

                    let relChange;
                    if (isSuccess) {
                        relChange = Math.floor(Math.random() * 15) + 1; 
                    } else {
                        relChange = -(Math.floor(Math.random() * 15) + 1); 
                    }
                    
                    updateRelationship(c1, c2, relChange);

                    dayLogs.push({ 
                        type: isSuccess ? 'success' : 'fail', 
                        text: script,
                        subtext: `친밀도 ${relChange > 0 ? '+' : ''}${relChange}`
                    });
                    
                    c1.status = `${c2.name}와 함께함`;
                    c2.status = `${c1.name}와 함께함`;
                }
            });

            // 최신 이벤트가 위로 오도록 배열을 뒤집고, 가장 위에 날짜 구분선을 추가합니다.
            dayLogs.reverse();
            dayLogs.unshift({ type: 'day_marker', day: currentDay });

            state.logs = [...dayLogs, ...state.logs].slice(0, 150);

            // 이벤트가 끝난 후 다음 날짜로 넘어갑니다.
            document.getElementById('day-display').innerText = state.day;
            state.day++;

            renderLogs();
            renderZones();
            switchTab('logs');
            
            // 일지 탭의 최상단으로 스크롤을 이동시킵니다.
            setTimeout(() => {
                const scrollTarget = document.getElementById('tab-logs');
                if(scrollTarget) scrollTarget.scrollTop = 0;
            }, 50);
        }

        function getEffectiveTrait(char, traitId) {
            const val = char.traits[traitId];
            if (val === true) return true;
            if (val === false) return false;
            return Math.random() > 0.5;
        }

        function updateRelationship(c1, c2, amount) {
            if (!c1.relationships[c2.id]) c1.relationships[c2.id] = 0;
            if (!c2.relationships[c1.id]) c2.relationships[c1.id] = 0;
            c1.relationships[c2.id] = Math.max(-100, Math.min(100, c1.relationships[c2.id] + amount));
            c2.relationships[c1.id] = Math.max(-100, Math.min(100, c2.relationships[c1.id] + amount));
        }

        function getContext(c1, c2=null) {
            const ctx = {
                name: `<strong class="text-stone-800 dark:text-stone-200">${c1.name}</strong>`,
                partner: c2 ? `<strong class="text-stone-800 dark:text-stone-200">${c2.name}</strong>` : '',
                food: getRandom(VOCAB.food),
                gear: getRandom(VOCAB.gear),
                animal: getRandom(VOCAB.animal),
                plant: getRandom(VOCAB.plant),
                bug: getRandom(VOCAB.bug),
                snack: getRandom(VOCAB.snack),
                activity: getRandom(VOCAB.activity)
            };
            return ctx;
        }

        function checkJongseong(word) {
            if (!word) return false;
            const lastChar = word.charCodeAt(word.length - 1);
            if (lastChar < 0xAC00 || lastChar > 0xD7A3) return false; 
            return (lastChar - 0xAC00) % 28 > 0;
        }

        function resolveJosa(text) {
             return text.replace(/(.)(은\(는\)|이\(가\)|을\(를\)|와\(과\))/g, (match, prevChar, josaType) => {
                const hasJongseong = checkJongseong(prevChar);
                let selectedJosa = '';
                
                if (josaType === '은(는)') selectedJosa = hasJongseong ? '은' : '는';
                else if (josaType === '이(가)') selectedJosa = hasJongseong ? '이' : '가';
                else if (josaType === '을(를)') selectedJosa = hasJongseong ? '을' : '를';
                else if (josaType === '와(과)') selectedJosa = hasJongseong ? '과' : '와';
                
                return prevChar + selectedJosa;
            });
        }

        function formatScript(template, data) {
            let replaced = template.replace(/\{([a-zA-Z0-9]+)\}/g, (match, key) => {
                return data[key] || match;
            });
            
            replaced = replaced.replace(/(<[^>]+>)?([^<]+)(<\/[^>]+>)?(은\(는\)|이\(가\)|을\(를\)|와\(과\))/g, (match, openTag, content, closeTag, josaType) => {
                const lastChar = content[content.length - 1];
                const hasJongseong = checkJongseong(lastChar);
                
                let selectedJosa = '';
                if (josaType === '은(는)') selectedJosa = hasJongseong ? '은' : '는';
                else if (josaType === '이(가)') selectedJosa = hasJongseong ? '이' : '가';
                else if (josaType === '을(를)') selectedJosa = hasJongseong ? '을' : '를';
                else if (josaType === '와(과)') selectedJosa = hasJongseong ? '과' : '와';
                
                return (openTag || '') + content + (closeTag || '') + selectedJosa;
            });

            return replaced;
        }

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function renderLogs() {
            const container = document.getElementById('log-container');
            container.innerHTML = '';
            
            if (state.logs && state.logs.length > 0) {
                state.logs.forEach(log => {
                    const div = document.createElement('div');
                    
                    if (log.type === 'day_marker') {
                        // 날짜 구분선 스타일
                        div.className = 'flex items-center py-5 animate-fade-in w-full';
                        div.innerHTML = `
                            <div class="flex-grow border-t border-stone-200 dark:border-slate-700"></div>
                            <span class="flex-shrink-0 mx-4 text-amber-700 dark:text-amber-400 text-xs font-bold tracking-widest uppercase bg-amber-50 dark:bg-amber-900/30 px-4 py-1.5 rounded-full border border-amber-200 dark:border-amber-800/50 shadow-sm">Day ${log.day}</span>
                            <div class="flex-grow border-t border-stone-200 dark:border-slate-700"></div>
                        `;
                    } else {
                        // 일반 로그 스타일
                        let style = log.type === 'success' ? 'border-green-400 text-stone-800 dark:text-stone-200' :
                                    log.type === 'fail' ? 'border-red-400 text-stone-800 dark:text-stone-200' :
                                    'border-stone-300 dark:border-stone-600 text-stone-600 dark:text-stone-400';
                        
                        div.className = `log-item bg-white dark:bg-slate-800 p-3 rounded-r-lg shadow-sm animate-fade-in ${style}`;
                        div.innerHTML = `
                            <div>
                                <p class="text-sm">${log.text}</p>
                                ${log.subtext ? `<p class="text-xs text-amber-600 dark:text-amber-400 font-medium mt-1">${log.subtext}</p>` : ''}
                            </div>
                        `;
                    }
                    container.appendChild(div);
                });
            }
        }

        // --- UI Rendering ---
        function switchTab(tabId) {
            ['members', 'camp', 'logs'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.querySelector(`button[data-tab="${t}"]`);
                if (t === tabId) {
                    el.classList.remove('hidden');
                    setTimeout(() => { el.classList.remove('opacity-0'); el.classList.add('opacity-100'); }, 50);
                    btn.classList.add('text-amber-600', 'active', 'dark:text-amber-400');
                    btn.classList.remove('text-stone-400');
                } else {
                    el.classList.add('opacity-0', 'hidden');
                    el.classList.remove('opacity-100');
                    btn.classList.remove('text-amber-600', 'active', 'dark:text-amber-400');
                    btn.classList.add('text-stone-400');
                }
            });
        }

        function renderTraitTable() {
            const headerRow = document.getElementById('table-header-row');
            const tbody = document.getElementById('trait-table-body');
            const emptyState = document.getElementById('empty-state');
            
            headerRow.innerHTML = '';
            tbody.innerHTML = '';

            if (state.characters.length === 0) {
                emptyState.style.display = 'block';
                document.getElementById('trait-table').classList.add('hidden');
                return;
            }
            emptyState.style.display = 'none';
            document.getElementById('trait-table').classList.remove('hidden');

            const cornerTh = document.createElement('th');
            cornerTh.className = "sticky-corner px-3 py-2 min-w-[100px] border-b border-stone-200 dark:border-slate-600 z-30 font-bold text-stone-700 dark:text-stone-200 bg-stone-50 dark:bg-slate-800";
            cornerTh.innerText = "성향 / 이름";
            headerRow.appendChild(cornerTh);

            state.characters.forEach(char => {
                const th = document.createElement('th');
                th.className = "sticky-col-header px-2 py-3 min-w-[70px] text-center border-b border-stone-200 dark:border-slate-600 bg-stone-50/95 dark:bg-slate-800/95 backdrop-blur z-20 group";
                th.innerHTML = `
                    <div class="flex flex-col items-center">
                        <span class="font-bold text-stone-700 dark:text-stone-200 text-sm truncate w-full">${char.name}</span>
                        <button onclick="deleteCharacter('${char.id}')" class="text-[10px] text-stone-300 hover:text-red-500 mt-1 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                headerRow.appendChild(th);
            });

            Object.keys(TRAIT_DATA).forEach(key => {
                const trait = TRAIT_DATA[key];
                const tr = document.createElement('tr');
                tr.className = "hover:bg-stone-50 dark:hover:bg-slate-700/50 transition-colors";
                
                const tdLabel = document.createElement('td');
                tdLabel.className = "sticky-row-header px-3 py-2 font-medium text-stone-600 dark:text-stone-300 text-xs z-10 flex items-center gap-2 border-r border-stone-100 dark:border-slate-600";
                tdLabel.innerHTML = `<i class="fa-solid ${trait.icon} text-amber-500 w-4 text-center"></i> ${trait.text}`;
                tr.appendChild(tdLabel);

                state.characters.forEach(char => {
                    const td = document.createElement('td');
                    td.className = "px-1 py-1 text-center border-l border-stone-100 dark:border-slate-700";
                    const val = char.traits[key];
                    let btnClass = val === true ? "bg-green-100 text-green-600 border-green-200 dark:bg-green-900/40 dark:text-green-400" :
                                   val === false ? "bg-red-100 text-red-600 border-red-200 dark:bg-red-900/40 dark:text-red-400" :
                                    "bg-stone-100 text-stone-300 border-stone-200 dark:bg-slate-700 dark:text-slate-500 dark:border-slate-600";
                    let icon = val === true ? "fa-check" : val === false ? "fa-xmark" : "fa-question";

                    td.innerHTML = `<button onclick="cycleTrait('${char.id}', '${key}')" class="w-6 h-6 rounded border flex items-center justify-center mx-auto text-xs ${btnClass}"><i class="fa-solid ${icon}"></i></button>`;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function cycleTrait(charId, traitId) {
            const char = state.characters.find(c => c.id === charId);
            const current = char.traits[traitId];
            char.traits[traitId] = current === null ? true : (current === true ? false : null);
            renderTraitTable();
        }

        function randomizeTraits() {
            if (state.characters.length === 0) return showToast('먼저 캐릭터를 등록해주세요.', 'error');
            
            const options = [true, false, null];
            state.characters.forEach(char => {
                Object.keys(TRAIT_DATA).forEach(traitKey => {
                    char.traits[traitKey] = options[Math.floor(Math.random() * options.length)];
                });
            });
            
            renderTraitTable();
            showToast('모든 캐릭터의 성향이 랜덤으로 배정되었습니다.', 'success');
        }

        function deleteCharacter(id) {
            showConfirm('삭제하시겠습니까?', () => {
                state.characters = state.characters.filter(c => c.id !== id);
                renderTraitTable();
                updateUI();
            });
        }

        function renderZones() {
            const mapContainer = document.getElementById('camp-map');
            mapContainer.innerHTML = '';
            ZONES.forEach(zone => {
                const div = document.createElement('div');
                div.className = `glass-panel rounded-2xl p-4 flex flex-col relative overflow-hidden ${zone.color} border border-opacity-60 dark:border-opacity-30`;
                div.innerHTML = `
                    <div class="flex items-center gap-2 mb-3 text-stone-700 dark:text-stone-300 opacity-80">
                        <i class="fa-solid ${zone.icon}"></i> <span class="font-bold text-sm">${zone.name}</span>
                    </div>
                    <div class="flex-1 flex flex-wrap gap-2 content-start min-h-[40px]" id="zone-${zone.id}"></div>
                `;
                const charContainer = div.querySelector(`#zone-${zone.id}`);
                state.characters.filter(c => c.location === zone.id).forEach(char => {
                    const avatar = document.createElement('div');
                    avatar.className = "w-9 h-9 rounded-full bg-white dark:bg-slate-700 shadow-sm flex items-center justify-center text-xs font-bold text-stone-700 dark:text-stone-200 border border-stone-200 dark:border-slate-600 cursor-pointer hover:scale-110 z-10 transition-transform";
                    avatar.innerText = char.name.substring(0, 2);
                    avatar.onclick = () => showCharDetails(char);
                    charContainer.appendChild(avatar);
                });
                mapContainer.appendChild(div);
            });
        }

        function showCharDetails(char) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').innerText = char.name;
            
            let relHtml = '<div class="mt-4"><h4 class="font-bold text-xs mb-2 text-stone-400">관계도</h4><div class="grid grid-cols-2 gap-2 text-xs">';
            state.characters.forEach(other => {
                if (other.id === char.id) return;
                const score = char.relationships[other.id] || 0;
                let found = REL_TIERS[3];
                for(let i=0; i<REL_TIERS.length; i++) {
                     if(score >= REL_TIERS[i].min) found = REL_TIERS[i];
                }

                relHtml += `
                    <div class="bg-stone-50 dark:bg-slate-700/50 p-2 rounded border border-stone-100 dark:border-slate-600">
                        <span class="font-bold text-stone-700 dark:text-stone-300">${other.name}</span>
                        <span class="${found.color} block mt-0.5">${found.label} (${score})</span>
                    </div>`;
            });
            relHtml += '</div></div>';

            const activeTraits = Object.entries(char.traits).filter(([k,v]) => v===true).map(([k]) => TRAIT_DATA[k].text).join(', ');
            
            document.getElementById('modal-content').innerHTML = `
                <p><span class="font-bold text-stone-500 dark:text-stone-400">상태:</span> ${char.status || '-'}</p>
                <p class="text-xs mt-2 text-green-600 dark:text-green-400 font-medium">성향(O): ${activeTraits || '없음'}</p>
                ${relHtml}
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        
        function updateUI() {
            const startBtn = document.getElementById('btn-next-day');
            if (!state.isStarted) {
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-stone-400');
                startBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
            } else {
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-stone-400');
                startBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');
            }
        }
    </script>
</body>
